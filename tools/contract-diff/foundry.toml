# Self-contained Foundry harness used ONLY to generate the differential-test
# fixture for @spry/fee. It compiles against the contract sources in the sibling
# spry-contracts checkout (read-only) using that repo's already-vendored libs,
# and writes a CSV fixture into this repo. It never modifies spry-contracts.
#
# Regenerate the fixture with:
#   forge script tools/contract-diff/script/DumpFees.s.sol --root tools/contract-diff
# (run from the spry-interface root). Requires Foundry and the spry-contracts
# checkout at ../spry-contracts relative to spry-interface.

[profile.default]
src = "script"
out = "out"
cache_path = "cache"
auto_detect_solc = true
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
# Let solc read the read-only contract sources + vendored libs in the sibling repo.
allow_paths = ["../../../spry-contracts"]
fs_permissions = [{ access = "read-write", path = "../../" }]
remappings = [
    "forge-std/=../../../spry-contracts/lib/forge-std/src/",
    "@prb/math/=../../../spry-contracts/lib/prb-math/",
    "@openzeppelin/contracts/=../../../spry-contracts/lib/openzeppelin-contracts/contracts/",
    "v4-core/=../../../spry-contracts/lib/v4-core/",
    "@uniswap/v4-core/=../../../spry-contracts/lib/v4-core/",
    "v4-periphery/=../../../spry-contracts/lib/v4-periphery/",
    "solmate/=../../../spry-contracts/lib/v4-core/lib/solmate/",
    "permit2/=../../../spry-contracts/lib/v4-periphery/lib/permit2/",
    "spry/=../../../spry-contracts/contracts/",
]
